# Phần cấp `http` dùng chung cho bản HTTP (`deploy/nginx.conf`) và bản HTTPS (`deploy/nginx-https.conf.template`).
# Thư mục này được mount vào /etc/nginx/vietstrain.

# File có hash trong tên (asset của frontend, thư mục publish `p-<hash>`) không bao giờ đổi nội dung, nên trình
# duyệt được giữ vĩnh viễn. Trang HTML thì phải hỏi lại mỗi lần, để thấy bản build mới. Phản hồi của API giữ
# nguyên header của backend (giá trị rỗng nghĩa là nginx không thêm header).
map $uri $cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/builds/   "public, max-age=31536000, immutable";
    ~^/api/      "";
}

# Số lần đăng nhập từ một địa chỉ IP: 30 lần liền nhau, sau đó một lần mỗi 2 giây. Giới hạn theo tài khoản
# (năm lần sai thì khoá 15 phút) nằm ở API; giới hạn này chặn một máy dùng hết chỗ băm mật khẩu của mọi người
# (API băm nhiều nhất 4 lần cùng lúc) và làm chậm việc thử một mật khẩu trên nhiều tài khoản. Request vượt
# giới hạn bị từ chối ngay ở nginx, không tới API.
limit_req_zone $binary_remote_addr zone=login:1m rate=30r/m;
limit_req_status 429;
