# Thân của khối `server` phát webapp, dùng chung cho bản HTTP và bản HTTPS: header, nén, và các đường dẫn được
# phát. Mọi `add_header` nằm ở đây, ở cấp `server`; xem ghi chú bên dưới.

server_tokens off;

root /usr/share/nginx/html;

# Nén khi phát. Trình duyệt chỉ tải mỗi file publish một lần, nên không cần nén sẵn.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/javascript text/css;

# Mọi `add_header` nằm ở cấp `server`: nginx bỏ các header kế thừa ngay khi một `location` tự khai báo
# `add_header` của riêng nó. Header bảo mật đi kèm cả trang lỗi (`always`); header cache thì chỉ đi kèm
# phản hồi thành công, để một trang 404 không bị giữ lại như file bất biến.
add_header Cache-Control $cache_control;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Trang chỉ nạp mã, style, worker và dữ liệu từ chính origin này; không cho nhúng vào trang khác.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

# Ứng dụng định tuyến bằng phần sau dấu # nên chỉ có một trang.
location = / {
    try_files /index.html =404;
}

location /assets/ {
    try_files $uri =404;
}

# Chỉ đúng một dạng đường dẫn được phát, giống kiểm tra ở API: <slug>/b<mã build>/p-<12 chữ số hex>/<tên file>.
# File trung gian của build nằm ngoài thư mục `p-<hash>` nên không lọt ra ngoài.
location ~ "^/builds/[a-z0-9][a-z0-9-]*/b[0-9]+/p-[0-9a-f]{12}/[A-Za-z0-9][A-Za-z0-9._-]*$" {
    root /srv;
    try_files $uri =404;
}

# Tên `api` được hỏi lại ở DNS của Docker khi cần, không chỉ một lần lúc nginx khởi động: container `api` khởi
# động lại có thể nhận địa chỉ khác, và nginx giữ địa chỉ cũ thì mọi request tới API trả 502 cho tới khi nó
# được nạp lại. `proxy_pass` nhận một biến thì nginx mới phân giải tên lúc chạy.
resolver 127.0.0.11 valid=5s;
set $api_upstream http://api:8000;

location /api/ {
    # Rộng hơn trần của chính API (4 MB) một chút, để request quá cỡ nhận câu từ chối của API (JSON mà giao
    # diện đọc được) thay vì trang HTML của nginx. Mặc định của nginx là 1 MB, nhỏ hơn một file FASTA được phép.
    client_max_body_size 5m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/auth/login {
    limit_req zone=login burst=30 nodelay;
    error_page 429 = @too_many_logins;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Cùng dạng lỗi với API, để trang đăng nhập đọc được mã lỗi. Chỉ áp dụng cho lời từ chối của chính nginx:
# câu trả lời của API đi qua nguyên vẹn (`proxy_intercept_errors` tắt).
location @too_many_logins {
    default_type application/json;
    return 429 '{"error":{"code":"TOO_MANY_LOGINS","message":"Too many logins from this address; try again in a minute"}}';
}

location / {
    return 404;
}
