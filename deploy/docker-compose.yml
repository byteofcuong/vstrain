# Chạy: docker compose -f deploy/docker-compose.yml up -d --build   (từ thư mục gốc của repo)
name: vietstrain

# Phần chung của các service chạy mã backend (cùng một image).
x-backend: &backend
  image: vietstrain-api
  build:
    context: ../backend
    dockerfile: ../deploy/api.Dockerfile
  environment:
    VS_DATABASE_URL: postgresql+psycopg://vietstrain:vietstrain@db:5432/vietstrain
    VS_DATA_DIR: /data
    VS_WORK_DIR: /work
  volumes:
    - ../backend:/srv/backend      # mã nguồn mount thẳng để sửa không cần build lại image
    - ../data:/data

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vietstrain
      POSTGRES_PASSWORD: vietstrain   # chỉ dùng cho máy phát triển; cổng chỉ mở trên 127.0.0.1
      POSTGRES_DB: vietstrain
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietstrain -d vietstrain"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Chạy một lần rồi thoát, trước khi API khởi động: migration và dữ liệu địa danh.
  init:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.cli", "init-db"]

  api:
    <<: *backend
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Chạy job nền (gióng mẫu, dựng cây). Image riêng vì cần Augur, Nextclade, IQ-TREE.
  worker:
    <<: *backend
    image: vietstrain-worker
    build:
      context: ../backend
      dockerfile: ../deploy/worker.Dockerfile
    volumes:
      - ../backend:/srv/backend
      - ../data:/data
      - work:/work                   # thư mục làm việc của job nằm trên volume của Docker, nhanh hơn ổ Windows
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.jobs.worker"]
    restart: on-failure            # worker tự bắt lỗi trong vòng lặp; đây là lớp dự phòng nếu tiến trình vẫn chết

volumes:
  pgdata:
  work:
