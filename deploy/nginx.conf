# Service `web`: cổng vào duy nhất của bản triển khai. Nó phát frontend đã build, phát các bản publish của build,
# và chuyển /api sang service `api`. Mọi đường dẫn khác trả 404.
#
# File này được mount vào /etc/nginx/conf.d/default.conf, tức nằm trong khối `http` của nginx. Đây là bản HTTP
# dùng trên máy phát triển; bản HTTPS là `nginx-https.conf.template` (xem `docker-compose.https.yml`). Hai bản
# dùng chung các file trong `deploy/nginx/`.

include /etc/nginx/vietstrain/http.conf;

server {
    listen 80;
    server_name _;
    include /etc/nginx/vietstrain/site.conf;
}
