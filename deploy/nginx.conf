# Service `web`: cổng vào duy nhất của bản triển khai. Nó phát frontend đã build, phát các bản publish của build,
# và chuyển /api sang service `api`. Mọi đường dẫn khác trả 404.
#
# File này được mount vào /etc/nginx/conf.d/default.conf, tức nằm trong khối `http` của nginx.

# File có hash trong tên (asset của frontend, thư mục publish `p-<hash>`) không bao giờ đổi nội dung, nên trình
# duyệt được giữ vĩnh viễn. Trang HTML thì phải hỏi lại mỗi lần, để thấy bản build mới. Phản hồi của API giữ
# nguyên header của backend (giá trị rỗng nghĩa là nginx không thêm header).
map $uri $cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/builds/   "public, max-age=31536000, immutable";
    ~^/api/      "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Nén khi phát. Trình duyệt chỉ tải mỗi file publish một lần, nên không cần nén sẵn.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css;

    # Mọi `add_header` nằm ở cấp `server`: nginx bỏ các header kế thừa ngay khi một `location` tự khai báo
    # `add_header` của riêng nó. Header bảo mật đi kèm cả trang lỗi (`always`); header cache thì chỉ đi kèm
    # phản hồi thành công, để một trang 404 không bị giữ lại như file bất biến.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Trang chỉ nạp mã, style, worker và dữ liệu từ chính origin này; không cho nhúng vào trang khác.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Ứng dụng định tuyến bằng phần sau dấu # nên chỉ có một trang.
    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Chỉ đúng một dạng đường dẫn được phát, giống kiểm tra ở API: <slug>/b<mã build>/p-<12 chữ số hex>/<tên file>.
    # File trung gian của build nằm ngoài thư mục `p-<hash>` nên không lọt ra ngoài.
    location ~ "^/builds/[a-z0-9][a-z0-9-]*/b[0-9]+/p-[0-9a-f]{12}/[A-Za-z0-9][A-Za-z0-9._-]*$" {
        root /srv;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
